<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Redirection…</title>
<meta name="robots" content="noindex">
<script>
/* ancienne adresse projet.html?id=<identifiant> -> /projets/<identifiant> */
const id = new URLSearchParams(location.search).get("id");
location.replace(id ? "/projets/" + encodeURIComponent(id) : "/");
</script>
</head>
<body><p><a href="/">Retour à l'accueil</a></p></body>
</html>
