<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#201F28">
<title>Projets</title>
<meta name="description" content="Tous les projets">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<header class="site-header" id="site-header"></header>

<main id="main">
  <header class="wrap page-head">
    <h1 class="rise">Projets</h1>
    <p class="lead rise" id="count" style="--d:1"></p>
  </header>
  <div class="wrap">
    <nav class="filters" id="filters" aria-label="Filtrer les projets" hidden></nav>
    <div class="grid" id="list"></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="schema.js"></script>
<script src="site.js"></script>
<script>
let data = { projects: [] };
let activeTag = null, activeType = null;

function renderFilters() {
  const types = [...new Set(data.projects.map(typeOf))];
  const tags = [...new Set(data.projects.flatMap(p => p.tags || []))].sort((a, b) => a.localeCompare(b, "fr"));
  const showTypes = types.length > 1;
  const nav = $("#filters");
  nav.hidden = !showTypes && tags.length < 2;
  nav.innerHTML = `<button data-all aria-pressed="${!activeType && !activeTag}">Tout</button>`
    + (showTypes ? types.map(t => `<button data-type="${esc(t)}" data-t="${esc(t)}" aria-pressed="${activeType === t}">${esc((TYPES[t] || OTHER).plural)}</button>`).join("") : "")
    + (showTypes && tags.length ? '<span class="sep" aria-hidden="true"></span>' : "")
    + tags.map(t => `<button data-tag="${esc(t)}" aria-pressed="${activeTag === t}">${esc(t)}</button>`).join("");
}

function renderList() {
  const items = data.projects.filter(p => (!activeTag || (p.tags || []).includes(activeTag)) && (!activeType || typeOf(p) === activeType));
  $("#list").innerHTML = items.length
    ? items.map((p, i) => card(p, i % 6, 2)).join("")
    : `<p class="empty">${data.projects.length ? "Aucun projet pour ce filtre." : "Aucun projet pour l'instant. Ajoutez-en depuis la page admin."}</p>`;
  reveal();
}

$("#filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if ("all" in b.dataset) activeType = activeTag = null;
  else if (b.dataset.type) activeType = activeType === b.dataset.type ? null : b.dataset.type;
  else if (b.dataset.tag) activeTag = activeTag === b.dataset.tag ? null : b.dataset.tag;
  renderFilters(); renderList();
});

(async () => {
  chrome("projects");
  try { data = await loadData(); } catch (e) { fail($("#main")); return; }
  applyProfile(data);
  const n = data.projects.length;
  $("#count").textContent = n ? `${n} projet${n > 1 ? "s" : ""}` : "";
  renderFilters();
  renderList();
})();
</script>
</body>
</html>
