<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#201F28">
<title>Portfolio</title>
<meta name="description" content="Portfolio de projets">
<link rel="stylesheet" href="theme.css?v=20261024">
<link rel="stylesheet" href="style.css?v=20261024">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Accueil"><span class="mono" id="mono">P</span></a>
    <div class="seg" role="tablist" aria-label="Sections du site">
      <button role="tab" id="tab-projects" data-view="projects" aria-selected="true" aria-controls="view-projects">Projets</button>
      <button role="tab" id="tab-cv" data-view="cv" aria-selected="false" aria-controls="view-cv">CV</button>
    </div>
    <div class="header-end"><a class="btn btn-sm" href="admin.html">Admin</a></div>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-main">
      <p class="eyebrow rise" id="eyebrow" style="--d:0"></p>
      <h1 class="rise" id="name" style="--d:1">Portfolio</h1>
      <p class="lead rise" id="tagline" style="--d:2"></p>
    </div>
    <div class="hero-side rise" style="--d:3">
      <div class="bio" id="bio"></div>
      <ul class="links" id="contact"></ul>
    </div>
  </div>
</section>

<main>
  <section id="view-projects" class="wrap" role="tabpanel" aria-labelledby="tab-projects">
    <nav class="filters" id="filters" aria-label="Filtrer les projets" hidden></nav>
    <div class="grid" id="list"><p class="empty">Chargement…</p></div>
  </section>

  <section id="view-cv" role="tabpanel" aria-labelledby="tab-cv" hidden>
    <div class="wrap">
    <div class="cv-head" id="cv-head"></div>
    <div class="subtabs" role="tablist" aria-label="Parties du CV">
      <button role="tab" id="ctab-experience" data-cv="experience" aria-selected="true" aria-controls="cv-experience">Expérience <span class="count" id="count-experience"></span></button>
      <button role="tab" id="ctab-education" data-cv="education" aria-selected="false" aria-controls="cv-education">Formation <span class="count" id="count-education"></span></button>
      <button role="tab" id="ctab-skills" data-cv="skills" aria-selected="false" aria-controls="cv-skills">Compétences <span class="count" id="count-skills"></span></button>
      <button role="tab" id="ctab-interests" data-cv="interests" aria-selected="false" aria-controls="cv-interests" aria-label="Centres d'intérêt"><span class="lbl-full">Centres d'intérêt</span><span class="lbl-short">Intérêts</span> <span class="count" id="count-interests"></span></button>
      <button role="tab" id="ctab-about" data-cv="about" aria-selected="false" aria-controls="cv-about">À propos <span class="count" id="count-about"></span></button>
    </div>
    </div>
    <div id="cv-experience" role="tabpanel" aria-labelledby="ctab-experience"></div>
    <div id="cv-education" role="tabpanel" aria-labelledby="ctab-education" hidden></div>
    <div id="cv-skills" class="wrap" role="tabpanel" aria-labelledby="ctab-skills" hidden></div>
    <div id="cv-interests" class="wrap" role="tabpanel" aria-labelledby="ctab-interests" hidden></div>
    <div id="cv-about" class="wrap" role="tabpanel" aria-labelledby="ctab-about" hidden></div>
  </section>
</main>

<footer class="site-footer"><div class="wrap" id="copy"></div></footer>

<script src="schema.js?v=20261024"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https?:|mailto:)/i.test(u || "") ? u : "#";
/* chemins relatifs autorisés (ex. cv.pdf), mais pas javascript: ni data: */
const safeHref = u => /^\s*(javascript|data|vbscript):/i.test(u || "") ? "#" : (u || "#");
const paras = t => String(t || "").split(/\n{2,}/).filter(x => x.trim()).map(x => `<p>${esc(x.trim())}</p>`).join("");
const bullets = a => { const l = (Array.isArray(a) ? a : String(a || "").split("\n")).map(x => String(x).trim()).filter(Boolean); return l.length ? `<ul class="list">${l.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""; };
const csv = s => (Array.isArray(s) ? s : String(s || "").split(",")).map(x => String(x).trim()).filter(Boolean);
const chips = a => a.length ? `<ul class="chips">${a.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "";

const ICON = {
  dl: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
const live = '<span class="pill live"><i></i>en cours</span>';

/* types de projets (schema.js) */
const TYPES = (window.SCHEMA || {}).types || {};
const OTHER = { label: "Projet", plural: "Autres", code: "projet", facts: [], sections: [{ key: "description", root: true, label: "Description", kind: "long" }] };
const typeOf = p => TYPES[p.type] ? p.type : "other";
const def = p => TYPES[typeOf(p)] || OTHER;

const CV_TABS = ["experience", "education", "skills", "interests", "about"];
let data = { profile: {}, projects: [], cv: {} };
let activeTag = null, activeType = null, view = "projects", cvTab = "experience";

/* ---------- chargement ---------- */
async function load() {
  try {
    const r = await fetch("projects.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    $("#list").innerHTML = '<p class="empty">Impossible de charger projects.json. Ouvrez le site via GitHub Pages ou un serveur local (pas en double-cliquant sur le fichier).</p>';
    return;
  }
  data.projects = (data.projects || []).slice().sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0));
  data.cv = data.cv || {};
  renderProfile();
  renderCV();
  renderFilters();
  renderList();
  route();
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "cv" || h.startsWith("cv/")) {
    const t = h.slice(3);
    setView("cv", false);
    setCvTab(CV_TABS.includes(t) ? t : cvTab, false);
  } else {
    /* ancien lien index.html#identifiant -> page du projet */
    const pr = h && data.projects.find(x => x.id === h);
    if (pr) { location.replace("projet.html?id=" + encodeURIComponent(pr.id)); return; }
    setView("projects", false);
  }
}

function renderProfile() {
  const p = data.profile || {};
  if (p.name) {
    $("#name").textContent = p.name;
    $("#mono").textContent = p.name.trim().charAt(0).toUpperCase() || "P";
    document.title = p.name;
    $("#copy").textContent = "© " + new Date().getFullYear() + " " + p.name;
  }
  $("#eyebrow").textContent = (data.cv && data.cv.headline) || "";
  $("#tagline").textContent = p.tagline || "";
  $("#bio").innerHTML = paras(p.bio);
  $("#contact").innerHTML = (p.links || []).map(l => `<li><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("");
}

/* ---------- onglets ---------- */
function setView(v, touch = true) {
  view = v === "cv" ? "cv" : "projects";
  $$("[data-view]").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  $("#view-projects").hidden = view !== "projects";
  $("#view-cv").hidden = view !== "cv";
  tabsHint();
  if (touch) history.replaceState(null, "", view === "cv" ? "#cv/" + cvTab : location.pathname + location.search);
}
/* sous-onglets : un léger dégradé à droite tant qu'il reste des onglets à faire défiler (petits écrans) */
function tabsHint() {
  const s = $(".subtabs");
  s.classList.toggle("has-more", s.scrollLeft + s.clientWidth < s.scrollWidth - 2);
}
function setCvTab(t, touch = true) {
  cvTab = CV_TABS.includes(t) ? t : "experience";
  $$("[data-cv]").forEach(b => b.setAttribute("aria-selected", b.dataset.cv === cvTab));
  CV_TABS.forEach(k => { $("#cv-" + k).hidden = k !== cvTab; });
  if (touch) {
    history.replaceState(null, "", "#cv/" + cvTab);
    $("#ctab-" + cvTab).scrollIntoView({ inline: "center", block: "nearest" });
  }
  tabsHint();
}
$(".subtabs").addEventListener("scroll", tabsHint, { passive: true });
window.addEventListener("resize", tabsHint);

/* ---------- projets ---------- */
function renderFilters() {
  const types = [...new Set(data.projects.map(typeOf))];
  const tags = [...new Set(data.projects.flatMap(p => p.tags || []))].sort((a, b) => a.localeCompare(b, "fr"));
  const showTypes = types.length > 1;
  const nav = $("#filters");
  nav.hidden = !showTypes && tags.length < 2;
  nav.innerHTML = `<button data-all aria-pressed="${!activeType && !activeTag}">Tout</button>`
    + (showTypes ? types.map(t => `<button data-type="${esc(t)}" data-t="${esc(t)}" aria-pressed="${activeType === t}">${esc((TYPES[t] || OTHER).plural)}</button>`).join("") : "")
    + (showTypes && tags.length ? '<span class="sep" aria-hidden="true"></span>' : "")
    + tags.map(t => `<button data-tag="${esc(t)}" aria-pressed="${activeTag === t}">${esc(t)}</button>`).join("");
}

const card = (p, i = 0) => {
  const t = typeOf(p), img = p.images && p.images[0];
  return `
    <article class="card reveal" data-t="${t}" style="--i:${i % 6}">
      <div class="card-media">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : `<span class="ph" aria-hidden="true">${esc((p.title || "?").trim()[0] || "?")}</span>`}
        ${p.ongoing ? live : ""}
      </div>
      <div class="card-body">
        <p class="meta">${t !== "other" ? `<span class="kind" data-t="${t}">${esc(def(p).label.toLowerCase())}</span>` : ""}${p.year ? `<span>${esc(p.year)}</span>` : ""}</p>
        <h3><a class="stretch" href="projet.html?id=${esc(encodeURIComponent(p.id))}">${esc(p.title)}</a></h3>
        ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}
        ${chips(p.tags || [])}
      </div>
    </article>`;
};

function renderList() {
  const items = data.projects.filter(p => (!activeTag || (p.tags || []).includes(activeTag)) && (!activeType || typeOf(p) === activeType));
  $("#list").innerHTML = items.length
    ? items.map(card).join("")
    : `<p class="empty">${data.projects.length ? "Aucun projet pour ce filtre." : "Aucun projet pour l'instant. Ajoutez-en depuis la page admin."}</p>`;
  reveal();
}

/* apparition progressive des cartes (discrète) : une carte s'affiche quand elle entre à l'écran ;
   celles qu'on a déjà dépassées en défilant sont affichées tout de suite */
function reveal() {
  const els = $$(".reveal:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { rootMargin: "100000px 0px -6% 0px" });
  els.forEach(e => io.observe(e));
}

/* ---------- CV ---------- */
const MONTHS = ["janv", "f[ée]vr", "mars", "avr", "mai", "juin", "juil", "ao[uû]t", "sept", "oct", "nov", "d[ée]c"].map(m => new RegExp(m));
/* « Septembre 2024 » ou « 2024 » -> nombre comparable (null si pas d'année) */
const when = s => {
  s = String(s || "").toLowerCase();
  const y = s.match(/(?:19|20)\d{2}/);
  if (!y) return null;
  const m = MONTHS.findIndex(re => re.test(s));
  return +y[0] * 12 + Math.max(m, 0);
};
const rank = e => [e.current ? 1 : 0, when(e.start) ?? -1, when(e.end) ?? -1];
/* plus récent en premier ; « en cours » tout en haut ; à égalité, l'ordre saisi dans l'admin */
const byRecent = list => list.map((e, i) => [e, i]).sort(([a, i], [b, j]) => {
  const x = rank(a), y = rank(b);
  for (let k = 0; k < 3; k++) if (x[k] !== y[k]) return y[k] - x[k];
  return i - j;
}).map(([e]) => e);

const dates = e => {
  const s = (e.start || "").trim(), t = e.current ? "présent" : (e.end || "").trim();
  return s && t ? `${s} — ${t}` : s || t;
};
const timeline = (list, head, org) => {
  const items = list.filter(e => e[head] || e[org]);
  if (!items.length) return '<div class="wrap"><p class="empty">Rien à afficher pour l\'instant.</p></div>';
  /* de gauche à droite : du plus ancien au plus récent, en alternant haut / bas */
  const sorted = byRecent(items).reverse();
  /* position de chaque carte sur le dégradé : 0 % (le plus ancien) -> 100 % (le plus récent) */
  const pct = k => sorted.length > 1 ? Math.max(0, Math.min(100, Math.round(k / (sorted.length - 1) * 1000) / 10)) : 100;
  return `<div class="htl-scroll"><div class="htl" style="--n:${sorted.length}">${sorted.map((e, i) => {
    const sub = [e[org], e.place].filter(Boolean).map(esc).join('<span class="sep">·</span>');
    return `<article class="htl-card ${i % 2 ? "down" : "up"}${e.current ? " is-current" : ""}" style="grid-column:${i + 1};--k:${i};--t:${pct(i)}%;--tn:${pct(i + 1)}%;--tp:${pct(i - 1)}%">
      <span class="htl-dot" aria-hidden="true"></span>
      <div class="tl-when">${esc(dates(e))}</div>
      <h3>${esc(e[head])}</h3>
      ${sub ? `<p class="tl-sub">${sub}</p>` : ""}
      ${bullets(e.description)}
    </article>`;
  }).join("")}</div></div>`;
};

function renderCV() {
  const c = data.cv || {};
  const name = ((data.profile || {}).name || "").trim();
  const pdf = c.pdf
    ? `<a class="btn btn-primary" href="${esc(safeHref(c.pdf))}" download="${esc(name ? "CV - " + name + ".pdf" : "CV.pdf")}">${ICON.dl}Télécharger le CV</a>`
    : "";
  $("#cv-head").innerHTML = (c.summary ? `<div class="prose">${paras(c.summary)}</div>` : "")
    + pdf;
  $("#cv-head").hidden = !c.summary && !pdf;

  const exp = c.experience || [], edu = c.education || [];
  const skills = (c.skills || []).filter(g => g.label || (g.items || []).length);
  const langs = (c.languages || []).filter(l => (l.name || "").trim());
  const interests = (c.interests || []).map(x => typeof x === "string" ? { label: x } : x).filter(i => (i.label || "").trim());

  $("#cv-experience").innerHTML = timeline(exp, "role", "org");
  $("#cv-education").innerHTML = timeline(edu, "degree", "school");

  const skillsHtml = (skills.length ? `<div class="skills">${skills.map(g => `
      <div class="skill-card"><h3>${esc(g.label)}</h3>${chips(g.items || [])}</div>`).join("")}</div>` : "")
    + (langs.length ? `<h3 class="h-sub">Langues</h3><ul class="langs">${langs.map(l => `<li><span>${esc(l.name.trim())}</span>${l.level ? `<span class="lvl">${esc(l.level)}</span>` : ""}</li>`).join("")}</ul>` : "");
  $("#cv-skills").innerHTML = skillsHtml || '<p class="empty">Rien à afficher pour l\'instant.</p>';
    $("#cv-interests").innerHTML = interests.length
    ? `<div class="skills">${interests.map(i => `<div class="skill-card"><h3>${esc(i.label)}</h3>${i.description ? `<div class="prose">${paras(i.description)}</div>` : ""}</div>`).join("")}</div>`
    : '<p class="empty">Rien à afficher pour l\'instant.</p>';
  const about = (c.about || []).filter(b => (b.title || "").trim() || (b.text || "").trim());
  $("#cv-about").innerHTML = about.length
    ? `<div class="skills">${about.map(b => `<div class="skill-card">${b.title ? `<h3>${esc(b.title)}</h3>` : ""}<div class="prose">${paras(b.text)}</div></div>`).join("")}</div>`
    : '<p class="empty">Rien à afficher pour l\'instant.</p>';

  $("#count-experience").textContent = exp.length || "";
  $("#count-education").textContent = edu.length || "";
  $("#count-skills").textContent = skills.length || "";
  $("#count-interests").textContent = interests.length || "";
  $("#count-about").textContent = about.length || "";
  $$(".count").forEach(c => { c.hidden = !c.textContent; });
}

/* ---------- événements ---------- */
$$("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
$$("[data-cv]").forEach(b => b.addEventListener("click", () => setCvTab(b.dataset.cv)));
document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const t = e.target.closest('[role="tab"]'); if (!t) return;
  const tabs = [...t.parentElement.querySelectorAll('[role="tab"]')];
  const n = tabs[(tabs.indexOf(t) + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
  n.focus(); n.click();
});
$("#filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if ("all" in b.dataset) activeType = activeTag = null;
  else if (b.dataset.type) activeType = activeType === b.dataset.type ? null : b.dataset.type;
  else if (b.dataset.tag) activeTag = activeTag === b.dataset.tag ? null : b.dataset.tag;
  renderFilters(); renderList();
});

load();
</script>
</body>
</html>
