<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio de projets">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#1C2326; --muted:#5C676A; --line:#D8DCD6; --accent:#2E5E5A;
  --sans:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121719; --surface:#1A2124; --ink:#E7EBEA; --muted:#93A0A2; --line:#273033; --accent:#8FC4BE}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:.22em}
a:hover{color:var(--accent);text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.layout{max-width:1180px;margin:0 auto;padding:clamp(1.5rem,4vw,3.5rem);display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(2rem,6vw,6rem)}

aside{position:sticky;top:clamp(1.5rem,4vw,3.5rem);align-self:start;min-height:calc(100vh - 7rem);display:flex;flex-direction:column;gap:1.5rem}
h1{font-family:var(--sans);font-weight:600;font-size:clamp(2.6rem,6vw,4.25rem);line-height:.98;letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}
.tagline{font-family:var(--sans);font-size:1.125rem;color:var(--muted);margin:0}
.bio p{margin:0 0 1em}
.contact{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35rem;font-family:var(--sans);font-size:.98rem}
aside footer{margin-top:auto;font-family:var(--sans);font-size:.85rem;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 2rem}
.filters button{font:inherit;font-family:var(--sans);font-size:.9rem;padding:.3rem .85rem;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.filters button:hover{color:var(--ink);border-color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.row{position:relative;display:grid;grid-template-columns:200px minmax(0,1fr);gap:1.75rem;padding:1.75rem 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.thumb{aspect-ratio:4/3;background:var(--surface);border-radius:4px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-family:var(--sans);font-size:2.25rem;font-weight:500}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.row h2{margin:0;font-family:var(--sans);font-weight:500;font-size:1.4rem;letter-spacing:-.012em;line-height:1.25}
.row h2 button{all:unset;cursor:pointer}
.row h2 button::after{content:"";position:absolute;inset:0}
.row:hover h2 button{color:var(--accent)}
.row h2 button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
.year{font-family:var(--sans);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.summary{margin:.45rem 0 0}
.tags{margin:.5rem 0 0;font-family:var(--sans);font-size:.88rem;color:var(--muted)}
.empty{color:var(--muted);font-family:var(--sans)}

dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(920px,calc(100% - 2rem));max-height:calc(100dvh - 2rem);border-radius:8px;overflow:auto}
dialog::backdrop{background:rgba(10,14,15,.55)}
dialog[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.dlg-body{padding:clamp(1.25rem,3vw,2.25rem);display:grid;gap:1.5rem}
.dlg-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.dlg-head h2{margin:0;font-family:var(--sans);font-weight:600;font-size:clamp(1.6rem,3.5vw,2.25rem);letter-spacing:-.025em;line-height:1.1}
.dlg-head .tags{margin-top:.4rem}
.close{font:inherit;font-family:var(--sans);font-size:.9rem;padding:.3rem .85rem;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;flex:none}
.close:hover{border-color:var(--muted)}
.gallery #big{width:100%;max-height:60vh;object-fit:contain;background:var(--surface);border-radius:4px;display:block}
.thumbs{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
.thumbs button{padding:0;border:2px solid transparent;border-radius:4px;background:none;cursor:pointer;overflow:hidden;width:72px;height:54px;opacity:.65}
.thumbs button[aria-current="true"]{border-color:var(--accent);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.prose{max-width:66ch}
.prose p{margin:0 0 1em;white-space:pre-line}
.dlg-links{display:flex;gap:1.25rem;font-family:var(--sans);margin:0}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{position:static;min-height:0}
  aside footer{margin-top:0}
}
@media (max-width:600px){
  .row{grid-template-columns:1fr;gap:1rem}
  .thumb{max-width:260px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1 id="name">Portfolio</h1>
    <p class="tagline" id="tagline"></p>
    <div class="bio" id="bio"></div>
    <ul class="contact" id="contact"></ul>
    <footer><span id="copy"></span> <a href="admin.html">Administration</a></footer>
  </aside>

  <main>
    <nav class="filters" id="filters" aria-label="Filtrer par mot-clé" hidden></nav>
    <div id="list"><p class="empty">Chargement…</p></div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg-body" id="dlg-body"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https?:|mailto:)/i.test(u || "") ? u : "#";
const paras = t => String(t || "").split(/\n{2,}/).filter(x => x.trim()).map(x => `<p>${esc(x.trim())}</p>`).join("");

let data = { profile: {}, projects: [] };
let activeTag = null;

async function load() {
  try {
    const r = await fetch("projects.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    $("#list").innerHTML = '<p class="empty">Impossible de charger projects.json. Ouvrez le site via GitHub Pages ou un serveur local (pas en double-cliquant sur le fichier).</p>';
    return;
  }
  data.projects = (data.projects || []).slice().sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0));
  renderProfile();
  renderFilters();
  renderList();
  if (location.hash.length > 1) openProject(decodeURIComponent(location.hash.slice(1)));
}

function renderProfile() {
  const p = data.profile || {};
  if (p.name) { $("#name").textContent = p.name; document.title = p.name; $("#copy").textContent = "© " + new Date().getFullYear() + " " + p.name + "."; }
  $("#tagline").textContent = p.tagline || "";
  $("#bio").innerHTML = paras(p.bio);
  $("#contact").innerHTML = (p.links || []).map(l => `<li><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("");
}

function renderFilters() {
  const tags = [...new Set(data.projects.flatMap(p => p.tags || []))].sort((a, b) => a.localeCompare(b, "fr"));
  const nav = $("#filters");
  nav.hidden = tags.length < 2;
  nav.innerHTML = ["Tout", ...tags].map((t, i) =>
    `<button data-tag="${i ? esc(t) : ""}" aria-pressed="${(i ? t : null) === activeTag}">${esc(t)}</button>`).join("");
}

function renderList() {
  const items = data.projects.filter(p => !activeTag || (p.tags || []).includes(activeTag));
  if (!items.length) {
    $("#list").innerHTML = '<p class="empty">Aucun projet pour l\'instant. Ajoutez-en depuis la page Administration.</p>';
    return;
  }
  $("#list").innerHTML = items.map(p => `
    <article class="row">
      <div class="thumb" aria-hidden="true">${p.images && p.images[0] ? `<img src="${esc(p.images[0])}" alt="" loading="lazy">` : esc((p.title || "?").trim()[0] || "?")}</div>
      <div class="info">
        <div class="line"><h2><button data-id="${esc(p.id)}">${esc(p.title)}</button></h2><span class="year">${esc(p.year)}</span></div>
        <p class="summary">${esc(p.summary)}</p>
        <p class="tags">${esc((p.tags || []).join(", "))}</p>
      </div>
    </article>`).join("");
}

function openProject(id) {
  const p = data.projects.find(x => x.id === id);
  if (!p) return;
  const imgs = p.images || [];
  const links = [p.link && ["Voir le projet", p.link], p.repo && ["Code source", p.repo]].filter(Boolean)
    .map(([t, u]) => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${t}</a>`).join("");
  $("#dlg-body").innerHTML = `
    <div class="dlg-head">
      <div><h2 id="dlg-title">${esc(p.title)}</h2><p class="tags">${esc([p.year, ...(p.tags || [])].filter(Boolean).join(", "))}</p></div>
      <button class="close" data-close>Fermer</button>
    </div>
    ${imgs.length ? `<div class="gallery"><img id="big" src="${esc(imgs[0])}" alt="${esc(p.title)}">${
      imgs.length > 1 ? `<div class="thumbs">${imgs.map((s, i) => `<button data-img="${esc(s)}" aria-label="Image ${i + 1}" aria-current="${i === 0}"><img src="${esc(s)}" alt=""></button>`).join("")}</div>` : ""}</div>` : ""}
    <div class="prose">${paras(p.description || p.summary)}</div>
    ${links ? `<p class="dlg-links">${links}</p>` : ""}`;
  $("#dlg").showModal();
  history.replaceState(null, "", "#" + encodeURIComponent(id));
}

$("#filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  activeTag = b.dataset.tag || null;
  renderFilters(); renderList();
});
$("#list").addEventListener("click", e => {
  const b = e.target.closest("[data-id]"); if (b) openProject(b.dataset.id);
});
$("#dlg").addEventListener("click", e => {
  if (e.target === e.currentTarget || e.target.closest("[data-close]")) e.currentTarget.close();
  const t = e.target.closest("[data-img]");
  if (t) {
    $("#big").src = t.dataset.img;
    document.querySelectorAll(".thumbs button").forEach(x => x.setAttribute("aria-current", x === t));
  }
});
$("#dlg").addEventListener("close", () => history.replaceState(null, "", location.pathname + location.search));

load();
</script>
</body>
</html>
