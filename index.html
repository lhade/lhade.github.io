<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#201F28">
<title>Portfolio</title>
<meta name="description" content="Portfolio : projets et CV">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<header class="site-header" id="site-header"></header>

<main id="main">
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-main">
        <p class="eyebrow rise" id="eyebrow" style="--d:0"></p>
        <h1 class="rise" id="name" style="--d:1">Portfolio</h1>
        <p class="lead rise" id="tagline" style="--d:2"></p>
        <div class="cta rise" style="--d:3">
          <a class="btn btn-primary" href="projets.html">Voir les projets</a>
          <a class="btn" href="cv.html">Mon CV</a>
        </div>
      </div>
      <div class="hero-side rise" style="--d:4">
        <div class="bio" id="bio"></div>
        <ul class="links" id="contact"></ul>
      </div>
    </div>
  </section>

  <section class="wrap section" id="featured-section" aria-labelledby="featured-title" hidden>
    <div class="section-head">
      <h2 id="featured-title">Projets à la une</h2>
      <a class="more" href="projets.html">Tous les projets →</a>
    </div>
    <div class="grid feature" id="featured"></div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="schema.js"></script>
<script src="site.js"></script>
<script>
(async () => {
  chrome("home");
  let data;
  try { data = await loadData(); } catch (e) { fail($("#main")); return; }
  applyProfile(data);

  /* anciens liens (index.html#identifiant, index.html#cv/…) -> nouvelles pages */
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "cv" || h.startsWith("cv/")) { location.replace("cv.html" + (h.length > 3 ? "#" + h.slice(3) : "")); return; }
  const old = h && data.projects.find(x => x.id === h);
  if (old) { location.replace(projectUrl(old)); return; }

  const p = data.profile;
  if (p.name) { $("#name").textContent = p.name; setMeta(p.name + " : portfolio", p.tagline || ""); }
  $("#eyebrow").textContent = data.cv.headline || "";
  $("#tagline").textContent = p.tagline || "";
  $("#bio").innerHTML = paras(p.bio);
  $("#contact").innerHTML = (p.links || []).map(l => `<li><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("");

  const list = featuredProjects(data.projects);
  if (list.length) {
    $("#featured").style.setProperty("--cols", Math.min(list.length === 4 ? 2 : list.length, 3));
    $("#featured").innerHTML = list.map((pr, i) => card(pr, i)).join("");
    $("#featured-section").hidden = false;
    reveal();
  }
})();
</script>
</body>
</html>
